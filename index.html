<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.google.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans:wght@300:400:500:600:700&display=swap" rel ="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="background-overlay">
    </div>
    <main class="dashboard">
        <header class="header">
            <h1 id="clock">00:00</h1>
            <p id="greeting">Welcome</p>

        </header>
        <form id="search-form" class="search-box" action="https://www.google.com/search" method="GET">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" name="q" id="search-input" placeholder="Search Google or Enter a URL" autocomplete="off" autofocus />

        </form>
        <section class="bookmarks-section">
            <div class="bookmarks-header">
                <h2>Quick Links</h2>
                <button id="open-modal-btn" class="add-btn" aria-label="Add Bookmark"> + Add Link</button>

            </div>
            <div id="bookmarks-grid" class="bookmarks-grid">

            </div>

        </section>
    </main>
    <footer class="apod-info" id="apod-info">
        <span class="apod-dot"></span>
        <span id="apod-title">Loading NASA APOD....</span>

    </footer>
    <div id="bookmark-modal" class="modal hidden">
        <div class="modal-card">
            <h3>Add New Shortcut</h3>
            <form id="bookmark-form">
                <label for="bm-title">Label</label>
                <input type="text" id="bm-title" placeholder="Github, Google..." required>
                <label for="bm-url">URL</label>
                <input type="url" id="bm-url" placeholder="https://github.com" required>
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>

                </div>

            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
